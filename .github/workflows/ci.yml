name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install libsodium
        shell: pwsh
        run: vcpkg install libsodium:x64-windows
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build/ci --config Release
      - name: Test 10,000 simulated games
        shell: pwsh
        run: |
          $env:NEON_SIMULATION_GAMES='10000'
          ctest --test-dir build/ci -C Release --output-on-failure
      - name: QML smoke tests
        shell: pwsh
        run: |
          & build/ci/NeonTycoon.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Game smoke test failed with exit code $LASTEXITCODE" }
          & build/ci/NeonTycoonLauncher.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Launcher smoke test failed with exit code $LASTEXITCODE" }
