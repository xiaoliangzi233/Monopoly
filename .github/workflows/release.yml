name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.1.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtshadertools
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install release dependencies
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          'C:\Program Files (x86)\NSIS' >> $env:GITHUB_PATH
          vcpkg install --triplet x64-windows
          python -m pip install pynacl requests
      - name: Configure production build
        shell: pwsh
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DNEON_UPDATE_PUBLIC_KEY_HEX="${{ vars.UPDATE_PUBLIC_KEY_HEX }}"
          -DNEON_GITHUB_MANIFEST_URL="${{ vars.PRIMARY_MANIFEST_URL }}"
          -DNEON_GITEE_MANIFEST_URL="${{ vars.GITEE_MANIFEST_URL }}"
      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build/release
          $env:NEON_SIMULATION_GAMES='10000'
          ctest --test-dir build/release --output-on-failure
      - name: Package NSIS installer
        shell: pwsh
        run: cpack --config build/release/CPackConfig.cmake -G NSIS -B dist
      - name: Resolve release metadata
        id: meta
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $asset=(Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1)
          if (!$asset) { throw 'NSIS installer was not produced' }
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid release tag' }
          "asset=$($asset.FullName)" >> $env:GITHUB_OUTPUT
          "asset_name=$($asset.Name)" >> $env:GITHUB_OUTPUT
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "version=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_OUTPUT
          if ($env:RELEASE_TAG -match '-') { 'channel=beta' >> $env:GITHUB_OUTPUT } else { 'channel=stable' >> $env:GITHUB_OUTPUT }
      - name: Publish GitHub release
        id: github_release
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view "${{ steps.meta.outputs.tag }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.asset }}" --clobber
          } else {
            gh release create "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.asset }}" --generate-notes ${{ contains(steps.meta.outputs.tag, '-') && '--prerelease' || '' }}
          }
          $release=(gh release view "${{ steps.meta.outputs.tag }}" --json assets | ConvertFrom-Json)
          $downloadUrl=($release.assets | Select-Object -First 1).url
          if (!$downloadUrl) { throw 'GitHub did not return a release asset URL' }
          "download_url=$downloadUrl" >> $env:GITHUB_OUTPUT
      - name: Publish Gitee release
        id: gitee
        shell: pwsh
        env:
          GITEE_TOKEN: '${{ secrets.GITEE_TOKEN }}'
        run: >-
          python scripts/publish_gitee.py
          --repository "${{ vars.GITEE_REPOSITORY }}"
          --tag "${{ steps.meta.outputs.tag }}"
          --asset "${{ steps.meta.outputs.asset }}"
          --replace-existing
          ${{ contains(steps.meta.outputs.tag, '-') && '--prerelease' || '' }}
      - name: Generate signed dual-source manifests
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: '${{ secrets.UPDATE_SIGNING_KEY }}'
        run: |
          python scripts/sign_manifest.py --channel "${{ steps.meta.outputs.channel }}" --version "${{ steps.meta.outputs.version }}" --url "${{ steps.github_release.outputs.download_url }}" --file "${{ steps.meta.outputs.asset }}" --output "manifests/github/${{ steps.meta.outputs.channel }}.json"
          python scripts/sign_manifest.py --channel "${{ steps.meta.outputs.channel }}" --version "${{ steps.meta.outputs.version }}" --url "${{ steps.gitee.outputs.download_url }}" --file "${{ steps.meta.outputs.asset }}" --output "manifests/gitee/${{ steps.meta.outputs.channel }}.json"
      - name: Publish manifest branch and mirror tags
        shell: pwsh
        env:
          GITEE_TOKEN: '${{ secrets.GITEE_TOKEN }}'
          GIT_ASKPASS: '${{ github.workspace }}\scripts\git-askpass.cmd'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git config user.name 'neon-release-bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git remote add gitee "https://oauth2@gitee.com/${{ vars.GITEE_REPOSITORY }}.git"
          git push gitee "${{ steps.meta.outputs.tag }}"
          git fetch origin update-manifests 2>$null
          if ($LASTEXITCODE -eq 0) { git switch update-manifests } else { git switch --orphan update-manifests; git rm -rf --ignore-unmatch . }
          New-Item -ItemType Directory -Force updates/github,updates/gitee | Out-Null
          Copy-Item "manifests/github/${{ steps.meta.outputs.channel }}.json" "updates/github/${{ steps.meta.outputs.channel }}.json"
          Copy-Item "manifests/gitee/${{ steps.meta.outputs.channel }}.json" "updates/gitee/${{ steps.meta.outputs.channel }}.json"
          git add updates
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "Update ${{ steps.meta.outputs.channel }} manifest to ${{ steps.meta.outputs.version }}" }
          git push origin update-manifests
          git push gitee update-manifests
